# Machine bootstrap for the macOS and Windows setups, driven by `mise bootstrap`.
#
# Covers the Homebrew packages from `Brewfile` and the `launchctl setenv`
# LaunchAgents that were previously generated by the Rakefile
# `push_system_env` task from `system/env`. Each agent runs
# `launchctl setenv KEY "$HOME/..."` at login so GUI apps inherit these
# variables.
#
# `$HOME` is expanded at runtime by the agent's shell because mise does not
# template the launchd section; this keeps the file machine-independent.
#
# Apply everything (packages, then the launchd agents):
#   cd bootstrap && mise trust && mise bootstrap
#
# Apply one part:
#   mise run bootstrap
#   mise bootstrap macos launchd-agents apply
#
# Inspect without changing anything:
#   mise bootstrap macos launchd-agents status
#   mise bootstrap macos launchd-agents apply --dry-run

# Windows copies every symlink-each file unless this is on. Real links need
# Developer Mode, and without it the apply fails instead of copying.
[settings]
dotfiles.windows_symlinks = true

# Symlink each dotfile into place, replacing the copy-based dev-env sync.
# symlink-each mirrors the directory structure and links file by file, so
# unmanaged neighbors (~/.config/zsh/.zsh_history, ~/.config/claude/, the
# uv symlinks in ~/.local/bin) stay untouched. Tools that rewrite their
# config in place (git config --global, mise use -g) write through the
# link without replacing it (verified).
#
# Apply from the canonical checkout, NOT from a worktree; the links point
# into whichever checkout ran the apply:
#   cd ~/Documents/github.com/hsbt/hsbt/bootstrap
#   mise bootstrap dotfiles apply --force   # --force replaces the old copies
[dotfiles]
"~/.config" = { source = "dotfiles/config", mode = "symlink-each", exclude = ["editrc", "ghostty/**", "mise/**", "tmux/**", "zsh/**"] }

# The rest of the tree only means something on macOS. The global mise config
# would compile ruby-dev on Windows, where Ruby comes from rbmanager.
"~/.config/editrc" = { source = "dotfiles/config/editrc", mode = "symlink", variants = [{ os = "macos" }] }
"~/.config/ghostty" = { source = "dotfiles/config/ghostty", mode = "symlink-each", variants = [{ os = "macos" }] }
"~/.config/mise" = { source = "dotfiles/config/mise", mode = "symlink-each", variants = [{ os = "macos" }] }
"~/.config/tmux" = { source = "dotfiles/config/tmux", mode = "symlink-each", variants = [{ os = "macos" }] }
"~/.config/zsh" = { source = "dotfiles/config/zsh", mode = "symlink-each", variants = [{ os = "macos" }] }
"~/.local/bin" = { source = "dotfiles/local/bin", mode = "symlink-each", variants = [{ os = "macos" }] }
"~/.local/share/cargo" = { source = "dotfiles/local/share/cargo", mode = "symlink-each", variants = [{ os = "macos" }] }

# helix ignores XDG_CONFIG_HOME on Windows and reads only %APPDATA%.
"~/AppData/Roaming/helix/config.toml" = { source = "dotfiles/config/helix/config.toml", mode = "symlink", variants = [{ os = "windows" }] }
# The shared git config includes this file, and git skips a missing include
# on macOS. It turns signing off because Windows has no signing key yet, and
# points git at the Windows OpenSSH, the only ssh the 1Password agent answers.
"~/.config/git/windows" = { source = "dotfiles/windows/config/git/windows", mode = "symlink", variants = [{ os = "windows" }] }
# $PROFILE lives in OneDrive, so it stays a stub that dot-sources this file
# rather than a link OneDrive would sync. The coreutils installer keeps its
# block in that stub.
"~/.config/powershell" = { source = "dotfiles/windows/config/powershell", mode = "symlink-each", variants = [{ os = "windows" }] }

# Run by `mise bootstrap` as its `mise run bootstrap` step.
#
# The Brewfile stays the source of truth rather than moving to
# `[bootstrap.packages]`. mise ships its own Homebrew installers that work
# without Homebrew, so packages it installs are not registered with the local
# Homebrew, which would break `brew services`, `brew upgrade`, `brew
# autoremove` and `brew cleanup`. `cask_args appdir` has no equivalent either.
#
# On Windows the task sets the user environment, imports `scoopfile.json`,
# brings the VC++ runtime up to date, installs PowerShell 7 from its MSI,
# and imports `winget.json`, plus `winget-x64.json` on x64 only. The files
# split the Brewfile's part between scoop and winget.
# Visual Studio Build Tools stay out of `winget.json` because winget alone
# installs them without the C++ components. Packages that install only from
# an administrator sit in `winget-admin.json`, imported by hand (see README).
[tasks.bootstrap]
description = "Install packages and, on Windows, set the user environment"
run = "brew bundle --file=Brewfile"
run_windows = ["ruby system/windows-env.rb", "scoop import scoopfile.json", "ruby system/windows-vcredist.rb", "ruby system/windows-pwsh.rb", "winget import -i winget.json --no-upgrade", "ruby system/windows-winget-x64.rb"]

[bootstrap.macos.launchd.agents."GOPATH.SetEnv"]
program = "/bin/sh"
args = ["-c", "launchctl setenv GOPATH \"$HOME/.local/share/go\""]
run_at_load = true

[bootstrap.macos.launchd.agents."CARGO_HOME.SetEnv"]
program = "/bin/sh"
args = ["-c", "launchctl setenv CARGO_HOME \"$HOME/.local/share/cargo\""]
run_at_load = true

[bootstrap.macos.launchd.agents."ZDOTDIR.SetEnv"]
program = "/bin/sh"
args = ["-c", "launchctl setenv ZDOTDIR \"$HOME/.config/zsh\""]
run_at_load = true

[bootstrap.macos.launchd.agents."CLAUDE_CONFIG_DIR.SetEnv"]
program = "/bin/sh"
args = ["-c", "launchctl setenv CLAUDE_CONFIG_DIR \"$HOME/.config/claude\""]
run_at_load = true

[bootstrap.macos.launchd.agents."COPILOT_HOME.SetEnv"]
program = "/bin/sh"
args = ["-c", "launchctl setenv COPILOT_HOME \"$HOME/.config/copilot\""]
run_at_load = true
